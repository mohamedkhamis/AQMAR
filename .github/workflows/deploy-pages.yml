name: Deploy to Cloudflare Pages

# Publishes the static SPA (repo root, served exactly like GitHub Pages) to
# Cloudflare Pages on every push to master, and on demand from the Actions tab.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - the account ID from the Cloudflare dashboard
#
# The site is pure static (no build step / Tailwind Play CDN), so we upload the
# checked-out tree as-is. --branch=master keeps this a PRODUCTION deploy so it
# lands on https://aqmar.pages.dev (not a per-commit preview URL).

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=aqmar --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
