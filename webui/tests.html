<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AqmarTofan SPA — Tests</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 2rem; }
    .pass { color: #6ee06e; }
    .fail { color: #f55; }
    h2 { border-bottom: 1px solid #444; padding-bottom: 0.3rem; }
    pre { background: #222; padding: 0.5rem; border-radius: 4px; overflow: auto; }
  </style>
</head>
<body>
  <h1>SPA tests</h1>
  <div id="results"></div>

  <script>
    // Tiny test runner — pushes results into #results
    window.AQMAR_TESTS = [];
    window.test = (name, fn) => window.AQMAR_TESTS.push({ name, fn });

    function assertEq(actual, expected, msg) {
      const a = JSON.stringify(actual);
      const e = JSON.stringify(expected);
      if (a !== e) throw new Error(`${msg || "assert"}: expected ${e}, got ${a}`);
    }
    window.assertEq = assertEq;

    function runAll() {
      const out = document.getElementById("results");
      let pass = 0, fail = 0;
      for (const t of window.AQMAR_TESTS) {
        try {
          t.fn();
          out.innerHTML += `<div class="pass">✓ ${t.name}</div>`;
          pass++;
        } catch (e) {
          out.innerHTML += `<div class="fail">✗ ${t.name}<pre>${e.message}</pre></div>`;
          fail++;
        }
      }
      out.innerHTML += `<h2>${pass} passed, ${fail} failed</h2>`;
    }
    window.addEventListener("load", runAll);
  </script>

  <!-- Modules under test — order matters: dependencies first -->
  <script src="filter-logic.js"></script>
  <script src="data-loader.js"></script>
  <script src="admin-edit.js"></script>

  <!-- Test files -->
  <script>
    // ===== filter-logic.js =====

    test("daysBetween returns 0 for same date", () => {
      assertEq(daysBetween("1985-06-15", "1985-06-15"), 0);
    });

    test("daysBetween returns positive when later", () => {
      assertEq(daysBetween("1985-06-15", "1985-06-20"), 5);
    });

    test("daysBetween returns negative when earlier", () => {
      assertEq(daysBetween("1985-06-15", "1985-06-10"), -5);
    });

    test("daysBetween handles cross-year", () => {
      assertEq(daysBetween("1985-12-31", "1986-01-01"), 1);
    });

    test("filterByProximity within 1month returns rows in window", () => {
      const rows = [
        { msg_id: 1, birth_date: "1985-06-10" }, // -5
        { msg_id: 2, birth_date: "1985-06-15" }, // 0
        { msg_id: 3, birth_date: "1985-07-20" }, // +35 (out)
        { msg_id: 4, birth_date: "" },           // (no birth date — skip)
        { msg_id: 5, birth_date: "1985-05-20" }, // -26
      ];
      const result = filterByProximity(rows, "1985-06-15", 30);
      assertEq(result.map(r => r.msg_id), [2, 1, 5]); // sorted by closeness
    });

    test("filterByProximity returns empty when userBirthdate is blank", () => {
      const rows = [{ msg_id: 1, birth_date: "1985-06-15" }];
      assertEq(filterByProximity(rows, "", 30), []);
    });

    test("filterByProximity attaches signed _delta_days", () => {
      const rows = [
        { msg_id: 1, birth_date: "1985-06-20" },
        { msg_id: 2, birth_date: "1985-06-10" },
      ];
      const result = filterByProximity(rows, "1985-06-15", 30);
      const deltas = result.map(r => r._delta_days);
      assertEq(deltas.sort(), [-5, 5]);
    });

    test("filterByProximity excludes rows beyond window", () => {
      const rows = [
        { msg_id: 1, birth_date: "1985-06-15" }, // 0
        { msg_id: 2, birth_date: "1985-08-15" }, // +61
      ];
      assertEq(filterByProximity(rows, "1985-06-15", 60).map(r => r.msg_id), [1]);
    });

    test("windowDaysFromMode resolves named modes", () => {
      assertEq(windowDaysFromMode("1week", 999), 7);
      assertEq(windowDaysFromMode("1month", 999), 30);
      assertEq(windowDaysFromMode("2months", 999), 60);
    });

    test("windowDaysFromMode clamps custom to [1,365]", () => {
      assertEq(windowDaysFromMode("custom", 0),    1);
      assertEq(windowDaysFromMode("custom", -10),  1);
      assertEq(windowDaysFromMode("custom", 999),  365);
      assertEq(windowDaysFromMode("custom", 45),   45);
    });

    test("windowDaysFromMode falls back to 30 for unknown mode", () => {
      assertEq(windowDaysFromMode("nonsense", 999), 30);
    });
  </script>

  <script>
    // ===== data-loader.js =====

    test("mergeOverrides applies override fields on top of base", () => {
      const base = [
        { msg_id: 20, name: "A", birth_date: "1980-01-01" },
        { msg_id: 21, name: "B", birth_date: "1981-02-02" },
      ];
      const overrides = {
        "20": { birth_date: "1979-12-31", _manual_edit_at: "2026-05-13T10:00:00" },
      };
      const merged = mergeOverrides(base, overrides);
      assertEq(merged[0].birth_date, "1979-12-31");
      assertEq(merged[0].name, "A");                                // unchanged
      assertEq(merged[0]._overridden_fields, ["birth_date"]);
      assertEq(merged[1].birth_date, "1981-02-02");                 // untouched
      assertEq(merged[1]._overridden_fields, []);
    });

    test("mergeOverrides ignores meta fields when reporting overridden", () => {
      const base = [{ msg_id: 5, name: "X" }];
      const overrides = { "5": { name: "Y", _manual_edit_at: "2026-05-13" } };
      const merged = mergeOverrides(base, overrides);
      assertEq(merged[0].name, "Y");
      assertEq(merged[0]._overridden_fields, ["name"]);
    });

    test("mergeOverrides leaves rows alone when no override matches", () => {
      const base = [{ msg_id: 99, name: "Z" }];
      const merged = mergeOverrides(base, { "1": { name: "ignored" } });
      assertEq(merged[0].name, "Z");
      assertEq(merged[0]._overridden_fields, []);
    });

    test("mergeOverrides accepts numeric and string msg_id keys", () => {
      const base = [{ msg_id: 42, name: "old" }];
      const merged = mergeOverrides(base, { 42: { name: "new" } });
      assertEq(merged[0].name, "new");
    });

    test("mergeOverrides preserves row order from base", () => {
      const base = [{ msg_id: 3 }, { msg_id: 1 }, { msg_id: 2 }];
      const merged = mergeOverrides(base, {});
      assertEq(merged.map(r => r.msg_id), [3, 1, 2]);
    });
  </script>

  <script>
    // ===== admin-edit.js =====

    test("buildEditDiff returns only changed fields", () => {
      const original = { name: "A", birth_date: "1980-01-01", city: "" };
      const edited =   { name: "B", birth_date: "1980-01-01", city: "غزة" };
      const diff = buildEditDiff(original, edited);
      assertEq(diff.name, "B");
      assertEq(diff.city, "غزة");
      assertEq(diff.birth_date, undefined);  // unchanged → not in diff
    });

    test("buildEditDiff returns empty object when nothing changed", () => {
      const original = { name: "A", birth_date: "1980-01-01" };
      const edited   = { name: "A", birth_date: "1980-01-01" };
      assertEq(buildEditDiff(original, edited), {});
    });

    test("buildEditDiff ignores fields starting with underscore", () => {
      const original = { name: "A", _delta_days: 5 };
      const edited =   { name: "A", _delta_days: 999 };
      assertEq(buildEditDiff(original, edited), {});
    });

    test("addEdit merges new diff with existing override + adds meta", () => {
      const existing = { "20": { name: "old override", _manual_edit_at: "2026-05-12" } };
      const diff = { birth_date: "1980-01-01" };
      const result = addEdit(existing, 20, diff, "2026-05-13T10:00:00", "admin");
      assertEq(result["20"].name, "old override");
      assertEq(result["20"].birth_date, "1980-01-01");
      assertEq(result["20"]._manual_edit_at, "2026-05-13T10:00:00");
      assertEq(result["20"]._editor, "admin");
    });

    test("addEdit creates a new override entry when none exists", () => {
      const result = addEdit({}, 99, { name: "fresh" }, "2026-05-13", "admin");
      assertEq(result["99"].name, "fresh");
      assertEq(result["99"]._manual_edit_at, "2026-05-13");
    });

    test("addEdit returns the same object reference unmodified when diff is empty", () => {
      const existing = { "20": { name: "old" } };
      const result = addEdit(existing, 20, {}, "2026-05-13", "admin");
      assertEq(result, existing);
    });

    test("buildExportPayload wraps edits with version", () => {
      const edits = { "20": { name: "X" } };
      const payload = buildExportPayload(edits);
      assertEq(payload.version, 1);
      assertEq(payload.edits, edits);
    });
  </script>

  <script>
    // ===== normalizeArabic =====

    test("normalizeArabic strips diacritics", () => {
      assertEq(normalizeArabic("مُحَمَّد"), "محمد");
    });

    test("normalizeArabic unifies alef variants", () => {
      assertEq(normalizeArabic("أحمد"), "احمد");
      assertEq(normalizeArabic("إيمان"), "ايمان");
      assertEq(normalizeArabic("آمنة"), "امنه");
    });

    test("normalizeArabic converts ya variants", () => {
      assertEq(normalizeArabic("على"), "علي");
    });

    test("normalizeArabic collapses whitespace", () => {
      assertEq(normalizeArabic("  محمد   أحمد  "), "محمد احمد");
    });

    test("normalizeArabic handles empty/null", () => {
      assertEq(normalizeArabic(""), "");
      assertEq(normalizeArabic(null), "");
      assertEq(normalizeArabic(undefined), "");
    });
  </script>

  <script>
    // ===== searchPredicate =====

    const SAMPLE_ROW = {
      msg_id: 1,
      name: "محمد عبد الرحمن",
      city: "غزة",
      battalion: "كتيبة الشجاعية",
      brigade: "لواء غزة",
      military_rank: "رقيب",
      weapon: "أر بي جي",
      birth_date: "1990-03-15",
      martyrdom_date: "2023-10-12",
    };

    test("searchPredicate matches exact name", () => {
      assertEq(searchPredicate(SAMPLE_ROW, "محمد عبد الرحمن"), true);
    });

    test("searchPredicate matches partial name", () => {
      assertEq(searchPredicate(SAMPLE_ROW, "عبد"), true);
    });

    test("searchPredicate matches city", () => {
      assertEq(searchPredicate(SAMPLE_ROW, "غزة"), true);
    });

    test("searchPredicate matches battalion", () => {
      assertEq(searchPredicate(SAMPLE_ROW, "الشجاعية"), true);
    });

    test("searchPredicate matches brigade", () => {
      assertEq(searchPredicate(SAMPLE_ROW, "لواء"), true);
    });

    test("searchPredicate normalizes Arabic in query and field", () => {
      assertEq(searchPredicate({ ...SAMPLE_ROW, name: "أحمد" }, "احمد"), true);
    });

    test("searchPredicate returns true for empty query", () => {
      assertEq(searchPredicate(SAMPLE_ROW, ""), true);
      assertEq(searchPredicate(SAMPLE_ROW, "   "), true);
    });

    test("searchPredicate returns false on no match", () => {
      assertEq(searchPredicate(SAMPLE_ROW, "خانيونس"), false);
    });
  </script>

  <script>
    // ===== applyFilter composition (logic only — no Alpine context needed) =====

    function applyFilterPure(rows, opts) {
      // Mirrors app.js applyFilter() — pure version for testing.
      let r = rows;
      if (opts.searchQuery !== undefined && opts.searchQuery !== "") {
        r = r.filter(row => searchPredicate(row, opts.searchQuery));
      }
      if (opts.ageMin !== undefined || opts.ageMax !== undefined) {
        r = r.filter(row => {
          const age = computeAge(row.birth_date, row.martyrdom_date);
          if (age === null) return false;
          if (opts.ageMin !== undefined && age < opts.ageMin) return false;
          if (opts.ageMax !== undefined && age > opts.ageMax) return false;
          return true;
        });
      }
      if (opts.userBirthdate) {
        r = filterByProximity(r, opts.userBirthdate, opts.windowDays || 30);
      }
      return r;
    }

    const COMPOSITION_ROWS = [
      { msg_id: 1, name: "محمد", city: "غزة", birth_date: "1990-03-15", martyrdom_date: "2023-10-12" },
      { msg_id: 2, name: "أحمد", city: "خانيونس", birth_date: "1995-08-20", martyrdom_date: "2023-11-05" },
      { msg_id: 3, name: "محمد", city: "رفح", birth_date: "1985-01-10", martyrdom_date: "2023-09-30" },
    ];

    test("composition: search + birthdate window", () => {
      // searchQuery "محمد" + userBirthdate near 1990 (±6 years / 2200 days)
      // Row 1: delta = 0 days ✓; Row 3: delta ≈ 1891 days ✓; Row 2: name mismatch ✗
      const result = applyFilterPure(COMPOSITION_ROWS, {
        searchQuery: "محمد",
        userBirthdate: "1990-03-15",
        windowDays: 2200,  // ±6 years — wide enough to include both محمد rows
      });
      assertEq(result.map(r => r.msg_id).sort(), [1, 3]);
    });

    test("composition: search + age range", () => {
      // searchQuery "محمد" + age between 33 and 40
      const result = applyFilterPure(COMPOSITION_ROWS, {
        searchQuery: "محمد",
        ageMin: 33,
        ageMax: 40,
      });
      // msg_id 1: age 33 (1990→2023) ✓
      // msg_id 3: age 38 (1985→2023) ✓
      assertEq(result.map(r => r.msg_id).sort(), [1, 3]);
    });
  </script>
</body>
</html>
